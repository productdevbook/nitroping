name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run --filter @nitroping/contracts build
      - run: bun run test
      - run: bun run build
      - run: bunx wrangler types apps/api/src/worker-configuration.d.ts --check --config apps/api/wrangler.jsonc

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift build --package-path packages/ios

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: gradle -p packages/android :nitroping:assembleRelease -PnitropingCompileSdk=36 -PnitropingComposeBom=2026.06.01 --no-daemon
