<!doctype html>
<html lang="tr">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>NitroPing Dashboard</title>
    <style>body{margin:0;background:#f7f5fb;color:#20152e;font:15px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-weight:800;font-size:23px}.brand span{color:#7c3aed}.panel{background:#fff;border:1px solid #e5def0;border-radius:16px;padding:18px;margin-top:20px;box-shadow:0 8px 30px #2b15420b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:grid;gap:6px;font-weight:600;font-size:13px}.field input,.field select{padding:10px;border:1px solid #d8cde5;border-radius:9px;font:inherit}.button{border:0;border-radius:9px;padding:10px 14px;background:#7c3aed;color:white;font-weight:700;cursor:pointer}.muted{color:#746a80}.error{color:#b42318;margin-top:12px}.item{border-top:1px solid #eee8f3;padding:16px 0;display:grid;grid-template-columns:1fr auto;gap:14px}.item:first-child{border-top:0}.badge{display:inline-block;border-radius:999px;background:#eee7ff;color:#5b21b6;padding:3px 8px;font-size:12px;font-weight:700}.item h3{margin:5px 0}.item p{white-space:pre-wrap;color:#675d71;margin:5px 0}.empty{text-align:center;padding:35px;color:#746a80}@media(max-width:700px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr}}</style>
  </head>
  <body><main class="wrap"><div class="top"><div class="brand">Nitro<span>Ping</span> Dashboard</div><a href="/">Landing</a></div>
    <section class="panel"><div class="grid"><label class="field">Project ID<input id="project" value="demo-project" /></label><label class="field">Public key<input id="publicKey" value="pk_demo" /></label><label class="field">Server key<input id="serverKey" type="password" placeholder="sk_…" /></label></div><p class="muted">Demo için server key: <code>sk_demo</code>. Gerçek projede bu anahtarı paylaşmayın.</p><button class="button" id="load">Feedback’leri yükle</button><div id="message"></div></section>
    <section class="panel"><div id="list" class="empty">Feedback listesi yüklenmedi.</div></section>
  </main><script>
    const api='/api/v1'; const $=id=>document.getElementById(id); const message=(text,err=false)=>{$('message').className=err?'error':'muted';$('message').textContent=text};
    async function load(){const project=$('project').value.trim(), publicKey=$('publicKey').value.trim(), serverKey=$('serverKey').value.trim(); message('Yükleniyor…'); try{const r=await fetch(`${api}/dashboard/projects/${encodeURIComponent(project)}/feedback?projectKey=${encodeURIComponent(publicKey)}`,{headers:{'x-nitroping-project-key':publicKey,'x-nitroping-server-key':serverKey}});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'İstek başarısız'); const list=$('list'); list.className=''; list.innerHTML=d.items.length?d.items.map(x=>`<article class="item"><div><span class="badge">${x.status}</span><h3>${escapeHtml(x.title)}</h3><p>${escapeHtml(x.body)}</p><small class="muted">${x.type} · ${new Date(x.createdAt).toLocaleString('tr-TR')}</small></div><label class="field">Durum<select data-id="${x.id}"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='triaged'?'selected':''}>triaged</option><option ${x.status==='planned'?'selected':''}>planned</option><option ${x.status==='in_progress'?'selected':''}>in_progress</option><option ${x.status==='resolved'?'selected':''}>resolved</option><option ${x.status==='closed'?'selected':''}>closed</option><option ${x.status==='spam'?'selected':''}>spam</option></select></label></article>`).join(''):'<div class="empty">Henüz feedback yok.</div>';list.querySelectorAll('select').forEach(s=>s.addEventListener('change',()=>update(s.dataset.id,s.value)));message(`${d.items.length} feedback yüklendi.`)}catch(e){message(e.message||'İstek başarısız',true)}}
    async function update(id,status){const publicKey=$('publicKey').value.trim(),serverKey=$('serverKey').value.trim();const r=await fetch(`${api}/dashboard/feedback/${id}/status?projectKey=${encodeURIComponent(publicKey)}`,{method:'POST',headers:{'content-type':'application/json','x-nitroping-project-key':publicKey,'x-nitroping-server-key':serverKey},body:JSON.stringify({status})});if(!r.ok)message('Durum güncellenemedi.',true);else message('Durum güncellendi.')}
    function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))} $('load').addEventListener('click',load);
  </script></body>
</html>
